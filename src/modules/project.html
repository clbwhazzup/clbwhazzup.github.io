<article class="project" id="{{id}}">
    <div class="project-head">
        <h2 class="project-title">{{title}}</h2>
        <ul class="tag-list">
            {{tags}}
        </ul>
    </div>
    <div class="project-body">
        <div class="project-text">
            {{body}}
        </div>
        <div class="project-media">
            {{media}}
        </div>
    </div>
</article>
